[project]
name = "mayak"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pytorch-lightning>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "rasterio>=1.3",
    "onnx>=1.22.0",
    "onnxruntime>=1.24.3",
    "hydra-core>=1.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-xdist", "ruff>=0.16"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
ignore = [
    "B905",
    "E731",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mayak*"]
exclude = ["runs*"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
