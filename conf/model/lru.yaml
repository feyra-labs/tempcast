# LRU: значения по умолчанию совпадают с конфигом модели в коде.
# Линейная рекуррентная память без разложения на якорь и аномалию.
arch: lru
horizon: 168
quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
max_history: 672
d_model: 64
d_state: 64
layers: 3
dropout: 0.0
tau_bounds: [3.0, 240.0]
min_period: 12.0
head_hidden: 128
scan: chunked
chunk: 32
