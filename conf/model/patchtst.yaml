# PatchTST: значения прогона берутся отсюда и пишутся в чекпойнт (см. conf/config.yaml).
# Малая конфигурация: суточные патчи без перекрытия, вход - последние 504 ч (21 сутки).
# Без дополнения патчей, RevIN, BatchNorm и residual attention зафиксированы в модели.
arch: patchtst
horizon: 168
quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
input_len: 504
patch_len: 24
stride: 24
d_model: 32
n_heads: 4
d_ff: 64
layers: 2
dropout: 0.2
attn_dropout: 0.0
head_dropout: 0.0
