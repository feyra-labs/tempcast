# Калибровка интервалов МАЯК: номинал, допуск проверки покрытия, бутстрэп, адаптивная поправка.
# Значения совпадают с конфигом калибровки в коде по умолчанию.
nominal: 0.9
tolerance: 0.04
min_windows: 20
min_stations: 2
bootstrap: 1000
ci_level: 0.9
seed: 0
conditional_dims: [зона Кёппена, длина истории]
sharpness_range: [0.25, 4.0]
sharpness_points: 33
aci_gamma: 0.005
aci_max_factor: 4.0
# офлайн-прогон адаптивной калибровки с ежечасным выпуском: тестовых станций и часов подряд
aci_stations: 8
aci_hours: 720
# калибровочный набор: шаг кандидатов, окон на станцию (null - все), сид длин истории
fit_every_hours: 24
fit_windows_per_station: null
fit_seed: 0
# окон бина длины истории не меньше этого - у бина своя строка таблицы, иначе маргинальная
fit_min_windows: 200
