# Отладочный прогон на CPU за минуты.
defaults:
  - default
  - _self_

stages:
  - {name: A, curriculum: L0, steps: 200}
  - {name: B, curriculum: full, steps: 1000}
batch_size: 32
windows_per_epoch: 2000
num_workers: 0
val_every: 200
lr_search_steps: 400
# Прогрев короче, чтобы этап A на 200 шагов успел дойти до пика: у всех этапов есть
# прогрев, плато и спад.
warmup_steps: 50
decay_frac: 0.2
