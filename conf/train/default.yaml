# Протокол обучения: значения прогона берутся отсюда и пишутся в чекпойнт
# (см. conf/config.yaml).
stages:
  - {name: A, curriculum: L0, steps: 10000}
  - {name: B, curriculum: full, steps: 200000}
batch_size: 256
windows_per_epoch: 200000
num_workers: 8
seed: 0
# Скорость обучения прогона без подбора: отладка и этап 2 (run.extra_tuning). После
# подбора (run.lr_search) её заменяет значение сетки lr_grid с наименьшим val/loss, при
# run.lr_from - значение основного МАЯК.
lr: 0.003
# Подбор: на каждом значении сетки полный этап A и этап B на lr_search_steps шагов. Минимум
# на краю сетки останавливает запуск: сетку расширяют здесь и повторяют подбор всех моделей.
lr_grid: [0.0003, 0.001, 0.003]
lr_search_steps: 20000
weight_decay: 0.01
betas: [0.9, 0.95]
# Расписание WSD: линейный прогрев warmup_steps шагов, плато, линейный спад до нуля на
# последней доле decay_frac шагов этапа (Protocol.lr_factor). Одно для этапов A, B и
# короткого этапа B при подборе. Ранней остановки нет: этап идёт ровно steps шагов.
lr_schedule: wsd
warmup_steps: 1000
decay_frac: 0.2
grad_clip: 1.0
ema_decay: 0.999
monitor: val/loss
val_every: 2000
seeds:
  init: null
  data: null
  augment: null
  eval: null
