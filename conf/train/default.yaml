# Протокол обучения: значения прогона берутся отсюда и пишутся в чекпойнт
# (см. conf/config.yaml).
stages:
  - {name: A, curriculum: L0, steps: 8000}
  # Прогон, остановленный до конца этапа, не проходит в стенд оценки: спада у него не было.
  - {name: B, curriculum: full, steps: 50000}
batch_size: 256
windows_per_epoch: 200000
num_workers: 8
seed: 0
# Скорость обучения прогона без подбора: отладка и этап 2 (run.extra_tuning). После
# подбора (run.lr_search) её заменяет значение сетки lr_grid с наименьшим val/loss, при
# run.lr_from - значение основного МАЯК.
lr: 0.003
# Подбор: на каждом значении сетки полный этап A и этап B на lr_search_steps шагов.
lr_grid: [0.0001, 0.001, 0.01]
lr_search_steps: 12000
# Допуск подбора, доля от val/loss минимума. Выбор: соседнее снизу от минимума lr, если
# его val/loss в пределах допуска, иначе сам минимум - поправка на короткий горизонт не
# больше одной клетки. Край (edge): минимум на краю сетки и лучше соседа больше чем на
# допуск, только для сведения в журнале. Фиксируется до подбора и одинаков для всех
# моделей.
lr_tol: 0.01
weight_decay: 0.01
betas: [0.9, 0.95]
# Расписание WSD: линейный прогрев warmup_steps шагов, плато, линейный спад до нуля на
# последней доле decay_frac шагов этапа (Protocol.lr_factor). Одно для этапов A, B и
# короткого этапа B при подборе. Ранней остановки нет: этап идёт ровно steps шагов.
lr_schedule: wsd
warmup_steps: 1000
decay_frac: 0.2
grad_clip: 1.0
# TF32 в матричных умножениях и свёртках при обучении на GPU (Ampere и новее): хранение
# fp32, умножения на тензорных ядрах с 10-битной мантиссой. Оценка, калибровка,
# робастность и экспорт идут в строгом fp32 без TF32, как устройство.
tf32: true
ema_decay: 0.999
monitor: val/loss
val_every: 1000
seeds:
  init: null
  data: null
  augment: null
  eval: null
