# Протокол обучения
stages:
  - {name: A, curriculum: L0, steps: 8000}
  - {name: B, curriculum: full, steps: 50000}
batch_size: 256
windows_per_epoch: 200000
num_workers: 8
seed: 0
# lr без подбора; при run.lr_search или run.lr_from заменяется
lr: 0.003
lr_grid: [0.0001, 0.001, 0.01]
lr_search_steps: 12000
# соседний снизу lr, если его val/loss в пределах допуска от минимума
lr_tol: 0.01
weight_decay: 0.01
betas: [0.9, 0.95]
# WSD: прогрев, плато, линейный спад на последней доле decay_frac; без ранней остановки
lr_schedule: wsd
warmup_steps: 1000
decay_frac: 0.2
grad_clip: 1.0
# TF32 только при обучении; оценка и экспорт - в строгом fp32
tf32: true
ema_decay: 0.999
monitor: val/loss
val_every: 1000
seeds:
  init: null
  data: null
  augment: null
  eval: null
