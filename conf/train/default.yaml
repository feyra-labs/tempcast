# Протокол обучения: значения прогона берутся отсюда и пишутся в чекпойнт
# (см. conf/config.yaml).
stages:
  - {name: A, curriculum: L0, steps: 10000}
  - {name: B, curriculum: full, steps: 200000}
batch_size: 256
windows_per_epoch: 200000
num_workers: 8
seed: 0
# Скорость обучения прогона без подбора; при подборе (run.lr_search) её заменяет
# значение сетки lr_grid с наименьшим val/loss, при run.lr_from - значение основного МАЯК.
lr: 0.003
# Подбор: на каждом значении сетки полный этап A и этап B на lr_search_steps шагов.
lr_grid: [0.0003, 0.001, 0.003]
lr_search_steps: 20000
weight_decay: 0.01
betas: [0.9, 0.95]
lr_schedule: cosine
grad_clip: 1.0
ema_decay: 0.999
monitor: val/loss
val_every: 2000
patience: 5
seeds:
  init: null
  data: null
  augment: null
  eval: null
