# Данные: значения по умолчанию = mayak.config.DataConfig().
manifest: data/manifest.csv
cache_root: null            # null - <каталог манифеста>/cache
time_bounds:                # контракт сплитов (mayak/data/splits.py); расхождение - ошибка
  hours_per_year: 8766
  test_frac: 0.3
  val_days: 60
  calib_days: 60
  gap_hours: 840
target_mask:
  min_valid_frac: 0.5
  first_day_hours: 24
val_every_hours: 72
val_max_windows: 8000
augment:
  profile: aggressive
  scale_prob: 0.3
  scale_max: [0.02, 0.001, 0.05]
  drift_prob: 0.3
  drift_max: [1.5, 1.5, 6.0]
  drift_rw_frac: 0.5
  offset_prob: 0.8
  offset_min: 0.1
  offset_max: 3.0
  noise_prob: 1.0
  noise_sd: [0.2, 0.3, 2.0]
  quant_prob: 0.5
  quant_f_frac: 0.4
  spike_prob: 0.2
  spike_max_count: 3
  spike_min: [12.0, 15.0, 40.0]
  spike_max: [30.0, 40.0, 80.0]
  stuck_prob: 0.15
  stuck_hours: [12, 96]
  units_prob: 0.05
  units_hours: [24, 96]
  units_p_frac: 0.3
  dropout_prob: 0.3
  dropout_max_rate: 0.2
  gap_prob: 0.5
  gap_max_count: 3
  gap_max_len: 96
  sparse_prob: 0.15
  sparse_every: [3, 6]
  outage_prob: 0.2
  outage_hours: [24, 240]
  drop_humidity_prob: 0.15
  drop_pressure_prob: 0.15
  coords_prob: 1.0
  coord_jitter_deg: 0.4
  elev_jitter_m: 50.0
window_qc: true
zone_weighting: inv_sqrt    # вес станции при сэмплировании: uniform | inv_sqrt | inv (по полной зоне)
zone_weight_cap: 0.0
