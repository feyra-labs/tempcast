# Данные и аугментации
manifest: data/manifest.csv
cache_root: null
time_layout:
  hours_per_year: 8766
  test_frac: 0.3
  n_blocks: 12
  gap_hours: 840
target_mask:
  min_valid_frac: 0.5
  first_day_hours: 24
val_every_hours: 24
val_windows_per_station: 96
val_seed: 0
augment:
  profile: default
  offset_prob: 0.4
  offset_min: 0.1                     # |b|, °C, лог-равномерно
  offset_max: 2.0
  offset_diurnal_frac: 0.5
  offset_diurnal_max: 1.5             # °C
  offset_peak_hours: [13.0, 16.0]     # местное солнечное время
  noise_prob: 1.0
  noise_sd: [0.2, 0.3, 2.0]
  rh_dewpoint_prob: 0.1
  stuck_prob: 0.15
  stuck_hours: [6, 48]
  dropout_prob: 0.3
  dropout_max_rate: 0.2
  gap_prob: 0.5
  gap_max_count: 3
  gap_max_len: 96
  drop_channel_prob: 0.28
  drop_channel_weights: [0.46, 0.46, 0.08]   # без P, без RH, без обоих
window_qc: true
