# Сценарии робастности для mayak.robustness; на обучение не влияют.
roles: [unseen_test]        # GHCNh - через --external-manifest
time_key: test
every_hours: 72
windows_per_station: 20
qc: device                  # device | none
leads: [1, 6, 24, 72, 168]
skill_tolerance: 0.05
guard_models: [МАЯК]
seed: 0
bootstrap: 1000
ci_level: 0.9
scenarios:
  # отказ входа: искажается только история
  - name: dropout           # доля потерянных часов (все каналы); 1.0 - вся история
    levels: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 0.97, 1.0]
  - name: gap               # последние N ч перед выпуском без данных
    levels: [0, 3, 6, 12, 24, 48, 96, 168, 336, 672]
  # свойство прибора: история и цель
  - name: offset            # постоянное смещение T, °C
    levels: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
  - name: offset_input      # только вход
    levels: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
  - name: drift             # дрейф T, °C/сут
    levels: [0.0, 0.02, 0.05, 0.1, 0.2]
  - name: drift_input
    levels: [0.0, 0.02, 0.05, 0.1, 0.2]
  - name: scale             # отклонение множителя T от единицы
    levels: [0.0, 0.01, 0.02, 0.05, 0.1]
  # отказ входа
  - name: noise             # разброс шума T, °C; у P и RH - в отношении sd_ratio
    levels: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0]
    params: {sd_ratio: [1.0, 1.5, 10.0]}
  - name: spikes            # доля точек с выбросом на magnitude
    levels: [0.0, 0.005, 0.01, 0.03, 0.1]
    params: {magnitude: [20.0, 25.0, 60.0]}
  - name: freeze            # последние N ч повторяют одно значение
    levels: [0, 6, 24, 72, 168, 336, 672]
    params: {channels: [0, 1, 2]}
  - name: drop_channel      # 0 - все, 1 - без P, 2 - без RH, 3 - без P и RH
    levels: [0, 1, 2, 3]
  - name: history           # убрано N самых старых часов; 672 - холодный старт
    levels: [0, 168, 336, 504, 600, 648, 666, 672]
  - name: coords            # ошибка координат, градусы, случайное направление
    levels: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  - name: elev              # ошибка высоты, м, случайный знак
    levels: [0.0, 50.0, 100.0, 250.0, 500.0, 1000.0]
