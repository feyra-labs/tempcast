# Корневой конфиг Hydra: python scripts/run.py [группа=вариант ...] [ключ=значение ...]
#
# Значения в группах model/, data/, train/ совпадают со значениями по умолчанию
# конфигов модели, данных и протокола обучения в коде; совпадение проверяется тестом.
# Здесь только композиция; источник истины - код.
defaults:
  - model: mayak
  - ablation: none
  - data: default
  - augment: default
  - train: default
  - _self_

run:
  out_root: runs
  # имя прогона: архитектура, вариант абляции, профиль аугментаций (кроме default),
  # базовый сид
  tag: ${model.arch}-${hydra:runtime.choices.ablation}${aug_suffix:${data.augment.profile}}-s${train.seed}
  accelerator: gpu
  # Раздельный запуск этапов; в протокол не входит и на сравнение моделей не влияет.
  # Этапы этого запуска подряд в порядке протокола, например [A] или [B]; null - все.
  stages: null
  # Чекпойнт предыдущего этапа, с которого стартует первый запускаемый этап, если он в
  # протоколе не первый. Выбирает человек по отчёту о поле.
  init_from: null
  # Порог отношения MSE поля к MSE климатологии на валидационных станциях при L=0:
  # выше порога этап B не начинается. Спецификация требует 1.05; null - только отчёт.
  require_gate: null
  # Пробный запуск последнего этапа: столько первых шагов при полном расписании.
  probe_steps: null
  # Этапы, у которых чекпойнт сохраняется после каждой валидации; null - этап холодного
  # старта, [] - ни один.
  candidates: null

hydra:
  job:
    chdir: false            # относительные пути к данным остаются относительными
  run:
    dir: ${run.out_root}/${run.tag}
  sweep:
    dir: ${run.out_root}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${run.tag}
  help:
    app_name: mayak-run
    header: |
      usage: python scripts/run.py [ГРУППА=ВАРИАНТ ...] [КЛЮЧ=ЗНАЧЕНИЕ ...] [--multirun]

      Обучение по единому протоколу с композицией конфигов (Hydra).
    footer: |
      Примеры:
        python scripts/run.py model=gru run.accelerator=cpu train=debug
        python scripts/run.py -m model=gru,dlinear,lru,patchtst   # бейзлайны
        python scripts/run.py model.encoder_width=64 train.seed=1
        python scripts/run.py -m ablation=none,no_compression train.seed=0
        python scripts/run.py -m train.seed=0,1,2
        python scripts/run.py augment=none          # профиль аугментаций
        python scripts/run.py run.stages=[A]        # только этап A, затем отчёт о поле
        python scripts/run.py run.stages=[B] run.init_from=<чекпойнт этапа A>

      Hydra: python scripts/run.py --hydra-help
    template: |
      ${hydra.help.header}
      == Группы конфигов ==
      $APP_CONFIG_GROUPS
      == Конфиг ==
      $CONFIG
      ${hydra.help.footer}
