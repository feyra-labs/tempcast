# Корневой конфиг Hydra: python scripts/run.py [группа=вариант ...] [ключ=значение ...]
#
# Значения прогона берутся из групп model/, data/, train/ и переопределений командной
# строки. Полностью разрешённый конфиг пишется в каталог прогона (config.json) и в каждый
# чекпойнт. Значения по умолчанию датаклассов в коде - только запасные для программного
# использования (вызов run_protocol из Python без конфига).
defaults:
  - model: mayak
  - ablation: none
  - data: default
  - augment: default
  - train: default
  - _self_

run:
  out_root: runs
  # Тег прогона и имя его каталога: <arch>[-<абляция>][-aug_<профиль>][-tuned][-s<сид>].
  # Не пишутся абляция none, профиль default, сид 0; -tuned - доп. настройка МАЯК.
  # Примеры: mayak, mayak-no_solar, mayak-aug_none, mayak-s1, mayak-tuned, gru.
  tag: ${run_tag:${model.arch},${hydra:runtime.choices.ablation},${data.augment.profile},${run.extra_tuning},${train.seed}}
  accelerator: gpu
  # Раздельный запуск этапов; в протокол не входит и на сравнение моделей не влияет.
  # Этапы этого запуска подряд в порядке протокола, например [A] или [B]; null - все.
  stages: null
  # Чекпойнт предыдущего этапа, с которого стартует первый запускаемый этап, если он в
  # протоколе не первый. Выбирает человек по отчёту этапа A (stageA/report.json и
  # графики stageA/report/); пересчёт отчёта: scripts/stage_report.py --run <каталог>.
  init_from: null
  # Этапы, у которых чекпойнт сохраняется после каждой валидации; null - этап холодного
  # старта, [] - ни один.
  candidates: null
  # Подбор скорости обучения, этап 1 сравнения: на каждом значении train.lr_grid полный
  # этап A и этап B на train.lr_search_steps шагов, выбор по val/loss, затем полный
  # прогон с выбранным значением. Идёт одной командой по всем этапам.
  lr_search: false
  # Каталог прогона основного МАЯК: из его журнала берутся выбранная скорость обучения и
  # запись о подборе, подбор не повторяется. Для абляций и повторов с другими сидами.
  lr_from: null
  # Дополнительная настройка МАЯК, этап 2 сравнения: любые гиперпараметры по валидации,
  # свой каталог, отдельная строка таблиц, в сравнение на равных не входит.
  extra_tuning: false

hydra:
  job:
    chdir: false            # относительные пути к данным остаются относительными
  run:
    dir: ${run.out_root}/${run.tag}
  # Групповой запуск пишет в те же каталоги, что и одиночный: <out_root>/<тег>.
  sweep:
    dir: ${run.out_root}
    subdir: ${run.tag}
  help:
    app_name: mayak-run
    header: |
      usage: python scripts/run.py [ГРУППА=ВАРИАНТ ...] [КЛЮЧ=ЗНАЧЕНИЕ ...] [--multirun]

      Обучение по единому протоколу с композицией конфигов (Hydra).
    footer: |
      Каталог прогона: run.out_root/<тег>, тег <arch>[-<абляция>][-aug_<профиль>][-tuned][-s<сид>].

      Примеры:
        python scripts/run.py train=debug run.accelerator=cpu      # отладка: runs/mayak
        python scripts/run.py model=gru                            # runs/gru
        python scripts/run.py -m model=gru,dlinear,lru,patchtst    # runs/gru, runs/dlinear, ...
        python scripts/run.py run.lr_search=true    # этап 1: подбор lr, затем полный прогон
        python scripts/run.py -m model=gru,dlinear,lru,patchtst run.lr_search=true
        python scripts/run.py run.stages=[A]        # только этап A, затем отчёт о поле
        python scripts/run.py run.stages=[B] run.init_from=runs/mayak/stageA/candidates/step006000.ckpt
        python scripts/run.py -m ablation=no_compression,no_solar run.lr_from=runs/mayak
        python scripts/run.py -m train.seed=1,2 run.lr_from=runs/mayak   # runs/mayak-s1, -s2
        python scripts/run.py augment=none run.lr_from=runs/mayak        # runs/mayak-aug_none
        python scripts/run.py run.extra_tuning=true train.lr=0.001 model.encoder_width=64
                                                    # этап 2: доп. настройка, runs/mayak-tuned

      Hydra: python scripts/run.py --hydra-help
    template: |
      ${hydra.help.header}
      == Группы конфигов ==
      $APP_CONFIG_GROUPS
      == Конфиг ==
      $CONFIG
      ${hydra.help.footer}
