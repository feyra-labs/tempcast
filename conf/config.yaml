# Корневой конфиг Hydra: python scripts/run.py [группа=вариант ...] [ключ=значение ...]
#
# Значения прогона берутся из групп model/, data/, train/ и переопределений командной
# строки. Полностью разрешённый конфиг пишется в каталог прогона (config.json) и в каждый
# чекпойнт. Значения по умолчанию датаклассов в коде - только запасные для программного
# использования (вызов run_protocol из Python без конфига).
defaults:
  - model: mayak
  - ablation: none
  - data: default
  - augment: default
  - train: default
  - _self_

run:
  out_root: runs
  # Тег прогона и имя его каталога: <arch>[-<абляция>][-aug_<профиль>][-tuned][-s<сид>].
  # Не пишутся абляция none, профиль default, сид 0; -tuned - доп. настройка МАЯК.
  # Примеры: mayak, mayak-no_solar, mayak-aug_none, mayak-s1, mayak-tuned, gru.
  tag: ${run_tag:${model.arch},${hydra:runtime.choices.ablation},${data.augment.profile},${run.extra_tuning},${train.seed}}
  accelerator: gpu
  # Подбор скорости обучения, этап 1 сравнения: на каждом значении train.lr_grid этапы
  # протокола с последним на train.lr_search_steps шагов в lr_search/lr<X>/, минимум по
  # val/loss (selected_lr) и флаг edge (минимум на краю сетки) в журнал protocol.json.
  # При edge: true запуск завершается ошибкой: расширить train.lr_grid и повторить подбор
  # всех моделей. Иначе в том же запуске полный этап B со старта с
  # lr_search/lr<selected_lr>/stageA/best.ckpt.
  lr_search: false
  # Каталог прогона основного МАЯК: из его журнала берутся скорость обучения и запись о
  # подборе, подбор не повторяется, этапы A и B идут подряд. Для абляций, повторов с
  # другими сидами и augment=none.
  lr_from: null
  # Дополнительная настройка МАЯК, этап 2 сравнения: любые гиперпараметры по валидации,
  # свой каталог, отдельная строка таблиц, в сравнение на равных не входит.
  extra_tuning: false

hydra:
  job:
    chdir: false            # относительные пути к данным остаются относительными
  run:
    dir: ${run.out_root}/${run.tag}
  # Групповой запуск пишет в те же каталоги, что и одиночный: <out_root>/<тег>.
  sweep:
    dir: ${run.out_root}
    subdir: ${run.tag}
  help:
    app_name: mayak-run
    header: |
      usage: python scripts/run.py [ГРУППА=ВАРИАНТ ...] [КЛЮЧ=ЗНАЧЕНИЕ ...] [--multirun]

      Обучение по единому протоколу с композицией конфигов (Hydra).
    footer: |
      Каталог прогона: run.out_root/<тег>, тег <arch>[-<абляция>][-aug_<профиль>][-tuned][-s<сид>].

      Примеры:
        python scripts/run.py train=debug run.accelerator=cpu      # отладка: runs/mayak
        python scripts/run.py run.lr_search=true    # этап 1: подбор lr и этап B
        python scripts/run.py -m model=gru,dlinear,lru,patchtst run.lr_search=true
        python scripts/run.py -m run.lr_from=runs/mayak ablation=no_compression,no_solar
        python scripts/run.py -m run.lr_from=runs/mayak train.seed=1,2   # runs/mayak-s1, -s2
        python scripts/run.py run.lr_from=runs/mayak augment=none        # runs/mayak-aug_none
        python scripts/run.py run.extra_tuning=true run.lr_search=true model.encoder_width=96
                                                    # этап 2: доп. настройка, runs/mayak-tuned

      Hydra: python scripts/run.py --hydra-help
    template: |
      ${hydra.help.header}
      == Группы конфигов ==
      $APP_CONFIG_GROUPS
      == Конфиг ==
      $CONFIG
      ${hydra.help.footer}
